[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlds490-hw1"
version = "0.1.0"
description = "Reproducible solutions and validation experiments for MLDS 490 Assignment 1"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ale-py>=0.10,<0.12",
  "autorom[accept-rom-license]>=0.6.1,<0.7",
  "gymnasium[atari,classic-control]>=1.1,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "torch>=2.5,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

